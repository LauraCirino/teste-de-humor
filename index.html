<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste De Humor</title>
    <link rel="shortcut icon" href="emoji-teste-humor-removebg-preview.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/webcamjs/1.0.26/webcam.js"></script>

    <link rel="stylesheet" href="style.css">
<body>
    <h3 class="btn btn-warning heading">
        teste de Humor
        <br>
        <span>&#128522;</span>
        <span>&#128512;</span>
        <span>&#128532;</span>
        <span>&#128546;</span>
        <span>&#128545;</span>
        <span>&#128548;</span>
    </h3>
    <br><br>
    <p style="font-size: 22px;">
        tire sua selfie parar testar seu humor e gerar um emoji 
        <br>
        <strong style="color: yellow;">você esta feliz?</strong>
        <br>
        <strong style="color: blue;">você esta triste?</strong>
        <br>
        <strong style="color: red;">você esta irritado?</strong>
    </p>
    <div class="container">
        <div>
            <label>Visualizalão da webcam:</label>
            <div id="camera"></div>
            <br><br>
            <button onclick="takeSnapshot();" class="btn btn-primary">Capturar imagem</button>
        </div>
        <div>
            <label>Previsão 1</label>
            <p class="emotionName" id="resultEmotionName"></p>
            <p class="emoji" id="updateEmoji"></p>

             <label>Previsão 2</label>
            <p class="emotionName" id="resultEmotionName2"></p>
            <p class="emoji" id="updateEmoji2"></p>
        </div>
        <div>
            <label>foto:</label>
            <div id="result"></div>
            <br><br>
            <button onclick="check();" class="btn btn-success">prever emoção</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
